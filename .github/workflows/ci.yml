name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_NAME: ts-app-starter
      APP_VERSION: ci
      API_HOST: 127.0.0.1
      API_PORT: 8090
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      DATABASE_URL: postgres://app:app_password@localhost:5438/app
      API_DOCS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm check:toolchain
      - run: pnpm db:migrate
      - name: Verify migration idempotency
        run: pnpm db:migrate
      - run: corepack pnpm smoke:generated
      - run: corepack pnpm check:boundaries
      - run: pnpm check
      - run: corepack pnpm audit --prod --audit-level high
